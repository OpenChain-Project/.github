title: OpenChain Work and Study Group Guidelines
description: Core processes and policy guidelines for OpenChain Project Work and Study Groups.
logo: "/assets/images/openchain-logo.svg"
favicon_ico: "/assets/images/favicon.png"

# Enable search bar branding
search_enabled: true
search:
  placeholder: "Search OpenChain guidelines..."
  heading_level: 2
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  tokenizer_separator: /[\s/]+/
  rel_url: true
  button: false
  focus_shortcut_key: 'k'

# Use "theme" instead of "remote_theme"
theme: "just-the-docs"
plugins:
  - jekyll-seo-tag

  # Tell Jekyll to look inside the /docs folder for your content
sourcedir: docs
include: [docs]

heading_anchors: true

# Auxiliary links (top right corner)
aux_links:
  "OpenChain Main Site": "https://www.openchainproject.org"
  "GitHub Organization": "https://github.com/OpenChain-Project"

last_edit_timestamp: true
last_edit_time_format: "%b %e %Y at %I:%M %p"
gh_edit_link: true
gh_edit_link_text: "Edit this page on GitHub."
gh_edit_repository: "https://github.com/OpenChain-Project/.github"
gh_edit_branch: "main"
gh_edit_view_mode: "edit"

defaults:
  - scope:
      path: "" # An empty string means ALL files in the project
    values:
      layout: "default"

callouts:
  highlight:
    color: yellow
  important:
    title: Important
    color: blue
  new:
    title: New
    color: green
  note:
    title: Note
    color: purple
  warning:
    title: Warning
    color: red

